name: contract

# Runs the integration tests against the real PlayStation, Xbox and RetroAchievements APIs once a day, so an
# unannounced API change is noticed before users report it. Each platform runs only if its secrets are set.

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Live API tests
        run: dotnet test tests/TrophyKit.IntegrationTests -c Release
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          PSN_PUBLIC_ONLINE_ID: ${{ secrets.PSN_PUBLIC_ONLINE_ID }}
          XBOX_CLIENT_ID: ${{ secrets.XBOX_CLIENT_ID }}
          XBOX_CLIENT_SECRET: ${{ secrets.XBOX_CLIENT_SECRET }}
          XBOX_REFRESH_TOKEN: ${{ secrets.XBOX_REFRESH_TOKEN }}
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
          RA_USER: ${{ secrets.RA_USER }}
