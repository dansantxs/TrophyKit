name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Unit tests
        run: dotnet test tests/TrophyKit.Tests --no-build -c Release
      - name: Pack (validation)
        run: dotnet pack --no-build -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
